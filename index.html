<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>IRIAMバッジ管理</title>
  <meta name="theme-color" content="#0e0a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="バッジ管理" />
  <style>
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    body { background:#0e0a1a; color:#e0d0ff; font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; }
    #app { max-width:430px; margin:0 auto; min-height:100vh; }
    input, textarea, select { font-family:inherit; }
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo } = React;

const STAR_COLORS = { 1:"#60d4f5", 2:"#3a6ef5", 3:"#a060d0", 4:"#f560b8", 5:"#f53030" };
function starColor(n) { return STAR_COLORS[n] || "#a090c0"; }

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getYearMonth(dateStr) { return dateStr ? dateStr.slice(0,7) : ""; }
function getMaxBadgeInMonth(badges, yearMonth) {
  const f = badges.filter(b => getYearMonth(b.date) === yearMonth);
  return f.length === 0 ? null : Math.max(...f.map(b => b.stars));
}
function fmtDateFull(s) {
  if (!s) return "—";
  const [y,m,d] = s.split("-");
  return `${y}/${parseInt(m)}/${parseInt(d)}`;
}
function fmtDate(s) {
  if (!s) return "—";
  const [,m,d] = s.split("-");
  return `${parseInt(m)}/${parseInt(d)}`;
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function loadListeners() {
  try { const r = localStorage.getItem("iriam_listeners"); return r ? JSON.parse(r) : []; }
  catch { return []; }
}
function saveListeners(d) {
  try { localStorage.setItem("iriam_listeners", JSON.stringify(d)); } catch {}
}

const S = {
  bg:"#0e0a1a", card:"#1e1640", card2:"#181030",
  border:"#3a3060", border2:"#3a2060",
  text:"#e0d0ff", sub:"#a090c0", dim:"#7060a0",
  faint:"#5a4880", fainter:"#4a3870", accent:"#a060d0",
};

function BottomSheet({ onClose, children }) {
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end",background:"rgba(0,0,0,0.5)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:S.card2,borderTop:`2px solid ${S.border2}`,borderRadius:"20px 20px 0 0",padding:"20px 20px 44px",maxWidth:430,width:"100%",margin:"0 auto"}}>
        <div style={{width:40,height:4,background:S.border2,borderRadius:99,margin:"0 auto 18px"}} />
        {children}
      </div>
    </div>
  );
}

function Btn({ onClick, style={}, children }) {
  return <button onClick={onClick} style={{cursor:"pointer",fontFamily:"inherit",...style}}>{children}</button>;
}
function Input({ value, onChange, placeholder, type="text" }) {
  return (
    <input type={type} value={value} onChange={onChange} placeholder={placeholder}
      style={{width:"100%",background:"#1a1530",border:`1.5px solid ${S.border}`,borderRadius:8,padding:"10px 12px",color:S.text,fontSize:"0.9rem",outline:"none",fontFamily:"inherit"}} />
  );
}
function Textarea({ value, onChange, placeholder, rows=2 }) {
  return (
    <textarea value={value} onChange={onChange} placeholder={placeholder} rows={rows}
      style={{width:"100%",background:"#1a1530",border:`1.5px solid ${S.border}`,borderRadius:8,padding:"10px 12px",color:S.text,fontSize:"0.85rem",outline:"none",resize:"none",fontFamily:"inherit"}} />
  );
}
function Field({ label, children, mb=14 }) {
  return (
    <div style={{marginBottom:mb}}>
      <div style={{fontSize:"0.7rem",color:S.dim,fontWeight:700,marginBottom:6}}>{label}</div>
      {children}
    </div>
  );
}

// リスナー追加・編集モーダル
function ListenerFormModal({ initial, onSave, onClose }) {
  const isEdit = !!initial;
  const [name, setName] = useState(initial?.name ?? "");
  const [followDate, setFollowDate] = useState(initial?.followDate ?? getTodayStr());
  const [memo, setMemo] = useState(initial?.followMemo ?? "");
  const save = () => {
    if (!name.trim()) return;
    onSave({ name:name.trim(), followDate, followMemo:memo.trim() });
    onClose();
  };
  return (
    <BottomSheet onClose={onClose}>
      <div style={{fontWeight:900,fontSize:"1rem",color:S.text,marginBottom:18}}>{isEdit ? "リスナー情報を編集" : "リスナーを追加"}</div>
      <Field label="リスナー名 *"><Input value={name} onChange={e=>setName(e.target.value)} placeholder="名前を入力" /></Field>
      <Field label="フォロー日"><Input type="date" value={followDate} onChange={e=>setFollowDate(e.target.value)} /></Field>
      <Field label="メモ" mb={20}><Textarea value={memo} onChange={e=>setMemo(e.target.value)} placeholder="配信名など" /></Field>
      <div style={{display:"flex",gap:8}}>
        <Btn onClick={onClose} style={{flex:1,padding:"12px",borderRadius:10,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.dim,fontWeight:700,fontSize:"0.9rem"}}>キャンセル</Btn>
        <Btn onClick={save} style={{flex:2,padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#f5607c,#7c72f5)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.9rem"}}>{isEdit ? "保存" : "追加"}</Btn>
      </div>
    </BottomSheet>
  );
}

// バッジ記録モーダル
function AddBadgeModal({ listener, onSave, onClose }) {
  const [stars, setStars] = useState(1);
  const [date, setDate] = useState(getTodayStr());
  const [memo, setMemo] = useState("");
  const save = () => { onSave({ id:newId(), stars, date, memo:memo.trim() }); onClose(); };
  return (
    <BottomSheet onClose={onClose}>
      <div style={{fontWeight:900,fontSize:"1rem",color:S.text,marginBottom:4}}>バッジ獲得を記録</div>
      <div style={{fontSize:"0.75rem",color:S.dim,marginBottom:18}}>{listener.name}</div>
      <Field label="星の数">
        <div style={{display:"flex",gap:6}}>
          {[1,2,3,4,5].map(s => (
            <Btn key={s} onClick={()=>setStars(s)} style={{flex:1,padding:"12px 0",borderRadius:10,fontWeight:900,fontSize:"1rem",background:stars===s?`${starColor(s)}33`:"#13102a",color:stars===s?starColor(s):"#4a3870",border:`2px solid ${stars===s?starColor(s):"#2a2040"}`,transition:"all 0.15s"}}>
              ☆{s}
            </Btn>
          ))}
        </div>
      </Field>
      <Field label="獲得日"><Input type="date" value={date} onChange={e=>setDate(e.target.value)} /></Field>
      <Field label="メモ" mb={20}><Textarea value={memo} onChange={e=>setMemo(e.target.value)} placeholder="配信名・コメントなど" /></Field>
      <div style={{display:"flex",gap:8}}>
        <Btn onClick={onClose} style={{flex:1,padding:"12px",borderRadius:10,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.dim,fontWeight:700,fontSize:"0.9rem"}}>キャンセル</Btn>
        <Btn onClick={save} style={{flex:2,padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#f5a623,#f5607c)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.9rem"}}>記録する</Btn>
      </div>
    </BottomSheet>
  );
}

// バッジ編集モーダル
function EditBadgeModal({ badge, listener, onSave, onClose }) {
  const [stars, setStars] = useState(badge.stars);
  const [date, setDate] = useState(badge.date);
  const [memo, setMemo] = useState(badge.memo ?? "");
  const save = () => { onSave({ ...badge, stars, date, memo:memo.trim() }); onClose(); };
  return (
    <BottomSheet onClose={onClose}>
      <div style={{fontWeight:900,fontSize:"1rem",color:S.text,marginBottom:4}}>バッジを編集</div>
      <div style={{fontSize:"0.75rem",color:S.dim,marginBottom:18}}>{listener.name}</div>
      <Field label="星の数">
        <div style={{display:"flex",gap:6}}>
          {[1,2,3,4,5].map(s => (
            <Btn key={s} onClick={()=>setStars(s)} style={{flex:1,padding:"12px 0",borderRadius:10,fontWeight:900,fontSize:"1rem",background:stars===s?`${starColor(s)}33`:"#13102a",color:stars===s?starColor(s):"#4a3870",border:`2px solid ${stars===s?starColor(s):"#2a2040"}`,transition:"all 0.15s"}}>
              ☆{s}
            </Btn>
          ))}
        </div>
      </Field>
      <Field label="獲得日"><Input type="date" value={date} onChange={e=>setDate(e.target.value)} /></Field>
      <Field label="メモ" mb={20}><Textarea value={memo} onChange={e=>setMemo(e.target.value)} placeholder="配信名・コメントなど" /></Field>
      <div style={{display:"flex",gap:8}}>
        <Btn onClick={onClose} style={{flex:1,padding:"12px",borderRadius:10,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.dim,fontWeight:700,fontSize:"0.9rem"}}>キャンセル</Btn>
        <Btn onClick={save} style={{flex:2,padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#a060d0,#f5607c)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.9rem"}}>保存</Btn>
      </div>
    </BottomSheet>
  );
}

// 月別バッジ履歴
function MonthlyBadgeHistory({ listener, onEditBadge, onDeleteBadge }) {
  const [expandedMonths, setExpandedMonths] = useState({});
  const toggle = (ym) => setExpandedMonths(prev => ({ ...prev, [ym]:!prev[ym] }));

  const sorted = [...listener.badges].sort((a,b) => b.date.localeCompare(a.date));
  const groups = {};
  sorted.forEach(b => {
    const ym = getYearMonth(b.date);
    if (!groups[ym]) groups[ym] = [];
    groups[ym].push(b);
  });
  const months = Object.keys(groups).sort().reverse();

  return (
    <div style={{marginBottom:16}}>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:"0.72rem",color:S.sub,fontWeight:700}}>バッジ履歴（{listener.badges.length}件）</div>
      </div>
      {months.length === 0 ? (
        <div style={{color:S.fainter,textAlign:"center",padding:"20px 0",fontSize:"0.85rem"}}>バッジ履歴がありません</div>
      ) : months.map(ym => {
        const [y,m] = ym.split("-");
        const mb = groups[ym];
        const maxS = Math.max(...mb.map(b => b.stars));
        const isOpen = !!expandedMonths[ym];
        return (
          <div key={ym} style={{marginBottom:8}}>
            <Btn onClick={()=>toggle(ym)} style={{width:"100%",background:S.card,border:`1.5px solid ${starColor(maxS)}44`,borderRadius:isOpen?"10px 10px 0 0":10,padding:"11px 14px",textAlign:"left"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{color:starColor(maxS),fontWeight:900,fontSize:"1.1rem"}}>☆{maxS}</span>
                  <span style={{fontSize:"0.78rem",color:S.sub,fontWeight:700}}>{y}年{parseInt(m)}月</span>
                  <span style={{fontSize:"0.68rem",color:S.faint}}>{mb.length}件</span>
                </div>
                <span style={{color:S.faint,fontSize:"0.8rem"}}>{isOpen ? "▲" : "▼"}</span>
              </div>
            </Btn>
            {isOpen && (
              <div style={{background:"#16122e",border:`1.5px solid ${starColor(maxS)}33`,borderTop:"none",borderRadius:"0 0 10px 10px",padding:"8px 10px"}}>
                {mb.sort((a,b)=>b.date.localeCompare(a.date)).map(b => (
                  <div key={b.id} style={{background:S.card,borderRadius:8,padding:"8px 12px",marginBottom:6}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:b.memo?5:0}}>
                      <span style={{color:starColor(b.stars),fontWeight:700,fontSize:"0.9rem"}}>☆{b.stars}</span>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:"0.72rem",color:S.dim}}>{fmtDate(b.date)}</span>
                        <Btn onClick={()=>onEditBadge(b)} style={{background:"#2a2040",border:`1px solid ${S.border}`,borderRadius:6,color:S.sub,fontSize:"0.62rem",padding:"2px 7px"}}>編集</Btn>
                        <Btn onClick={()=>onDeleteBadge(listener.id, b.id)} style={{background:"#2a1030",border:"1px solid #5a2040",borderRadius:6,color:"#f56070",fontSize:"0.62rem",padding:"2px 7px"}}>削除</Btn>
                      </div>
                    </div>
                    {b.memo && <div style={{fontSize:"0.75rem",color:S.dim,background:"#13102a",borderRadius:6,padding:"4px 8px"}}>{b.memo}</div>}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// 削除確認ダイアログ
function ConfirmDeleteModal({ name, onConfirm, onClose }) {
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.6)"}}>
      <div onClick={e=>e.stopPropagation()} style={{background:S.card2,border:"2px solid #5a2040",borderRadius:16,padding:"24px 20px",maxWidth:320,width:"90%",margin:"0 auto",textAlign:"center"}}>
        <div style={{fontSize:"1.5rem",marginBottom:10}}>🗑️</div>
        <div style={{fontWeight:900,fontSize:"1rem",color:S.text,marginBottom:8}}>リスナーを削除</div>
        <div style={{fontSize:"0.85rem",color:S.dim,marginBottom:20}}>
          <span style={{color:S.text,fontWeight:700}}>「{name}」</span>とバッジ履歴をすべて削除します。この操作は元に戻せません。
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn onClick={onClose} style={{flex:1,padding:"12px",borderRadius:10,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.sub,fontWeight:700,fontSize:"0.9rem"}}>キャンセル</Btn>
          <Btn onClick={onConfirm} style={{flex:1,padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#c0304a,#8a1030)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.9rem"}}>削除する</Btn>
        </div>
      </div>
    </div>
  );
}

// リスナー詳細画面
function ListenerDetail({ listener, onEditBadge, onDeleteBadge, onDelete, onClose }) {
  const [editingBadge, setEditingBadge] = useState(null);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  return (
    <div style={{position:"fixed",inset:0,zIndex:150,background:S.bg,overflowY:"auto",maxWidth:430,margin:"0 auto"}}>
      <div style={{background:"linear-gradient(135deg,#2a1a3e,#1a0e2e)",borderBottom:`1.5px solid ${S.border2}`,padding:"18px 20px 14px",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <Btn onClick={onClose} style={{background:"none",border:"none",color:S.sub,fontSize:"1.5rem",padding:"0 4px",lineHeight:1}}>‹</Btn>
          <div>
            <div style={{fontSize:"0.62rem",color:S.accent,fontWeight:700,letterSpacing:"0.2em"}}>リスナー詳細</div>
            <div style={{fontSize:"1.1rem",fontWeight:900,color:S.text}}>{listener.name}</div>
          </div>
        </div>
      </div>
      <div style={{padding:"16px 14px 60px"}}>
        <div style={{background:S.card,border:`1px solid ${S.border}`,borderRadius:14,padding:"14px 16px",marginBottom:16}}>
          <div style={{fontSize:"0.72rem",color:S.accent,fontWeight:700,marginBottom:10}}>📅 フォロー情報</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{fontSize:"0.8rem",color:S.sub}}>フォロー日</span>
            <span style={{fontSize:"0.9rem",fontWeight:700,color:S.text}}>{fmtDateFull(listener.followDate)}</span>
          </div>
          {listener.followDate && (()=>{
            const diff = Math.floor((new Date() - new Date(listener.followDate)) / (1000*60*60*24));
            return (
              <div style={{background:"#13102a",borderRadius:8,padding:"7px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:listener.followMemo?8:0}}>
                <span style={{fontSize:"0.75rem",color:"#6050a0"}}>フォローから</span>
                <span style={{fontSize:"0.95rem",fontWeight:900,color:S.accent}}>{diff}日</span>
              </div>
            );
          })()}
          {listener.followMemo && (
            <div style={{fontSize:"0.78rem",color:S.dim,background:"#13102a",borderRadius:8,padding:"6px 10px"}}>{listener.followMemo}</div>
          )}
        </div>
        <MonthlyBadgeHistory listener={listener} onEditBadge={b=>setEditingBadge(b)} onDeleteBadge={onDeleteBadge} />
        <Btn onClick={()=>setShowDeleteConfirm(true)}
          style={{width:"100%",padding:"12px",borderRadius:12,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.faint,fontSize:"0.85rem",fontWeight:700}}>
          このリスナーを削除
        </Btn>
      </div>
      {editingBadge && (
        <EditBadgeModal badge={editingBadge} listener={listener}
          onSave={upd=>{ onEditBadge(listener.id, upd); setEditingBadge(null); }}
          onClose={()=>setEditingBadge(null)} />
      )}
      {showDeleteConfirm && (
        <ConfirmDeleteModal name={listener.name}
          onConfirm={()=>{ onDelete(listener.id); onClose(); }}
          onClose={()=>setShowDeleteConfirm(false)} />
      )}
    </div>
  );
}

// リスナーカード
function ListenerCard({ listener, onTap, onAddBadge, onEditListener }) {
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const lmd = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const lastMonth = `${lmd.getFullYear()}-${String(lmd.getMonth()+1).padStart(2,'0')}`;
  const thisMax = getMaxBadgeInMonth(listener.badges, thisMonth);
  const lastMax = getMaxBadgeInMonth(listener.badges, lastMonth);
  const hasBadgeThisMonth = thisMax != null;
  return (
    <div style={{background:S.card,border:`1.5px solid ${hasBadgeThisMonth ? starColor(thisMax)+"88" : S.border}`,borderRadius:14,marginBottom:8,overflow:"hidden",boxShadow:hasBadgeThisMonth?`0 0 12px ${starColor(thisMax)}33`:"none"}}>
      <div style={{padding:"12px 14px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:"0.95rem",fontWeight:700,color:S.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1,marginRight:10}}>
          {listener.name}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"0.58rem",color:S.faint,marginBottom:2}}>先月</div>
            {lastMax != null
              ? <span style={{color:starColor(lastMax),fontWeight:900,fontSize:"1.3rem",lineHeight:1}}>☆{lastMax}</span>
              : <span style={{fontSize:"1rem",color:S.fainter,lineHeight:1}}>—</span>
            }
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:"0.58rem",color:S.faint,marginBottom:2}}>今月</div>
            {thisMax != null
              ? <span style={{color:starColor(thisMax),fontWeight:900,fontSize:"1.3rem",lineHeight:1}}>☆{thisMax}</span>
              : <span style={{fontSize:"1rem",color:S.fainter,lineHeight:1}}>—</span>
            }
          </div>
        </div>
      </div>

      <div style={{display:"flex",gap:8,padding:"0 12px 12px"}}>
        <Btn onClick={onAddBadge} style={{flex:2,padding:"9px 0",borderRadius:9,background:"linear-gradient(135deg,#f5a62322,#f5607c22)",color:"#f5a060",border:"1.5px solid #f5a06044",fontWeight:700,fontSize:"0.8rem"}}>＋ 記録</Btn>
        <Btn onClick={onEditListener} style={{flex:1,padding:"9px 0",borderRadius:9,background:"#2a204022",color:S.sub,border:`1.5px solid #3a306055`,fontWeight:700,fontSize:"0.8rem"}}>編集</Btn>
        <Btn onClick={onTap} style={{flex:1,padding:"9px 0",borderRadius:9,background:"#1a304022",color:"#60c0f5",border:"1.5px solid #3060a055",fontWeight:700,fontSize:"0.8rem"}}>詳細</Btn>
      </div>
    </div>
  );
}

// バックアップ・復元メニュー
function BackupMenuModal({ listeners, onRestore, onClose }) {
  const [showRestoreConfirm, setShowRestoreConfirm] = useState(false);
  const [pendingData, setPendingData] = useState(null);
  const [message, setMessage] = useState(null);

  const handleBackup = () => {
    const d = new Date();
    const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    const json = JSON.stringify(listeners, null, 2);
    const blob = new Blob([json], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `iriam_backup_${dateStr}.json`;
    a.click();
    URL.revokeObjectURL(url);
    setMessage("✅ バックアップを保存しました");
  };

  const handleFileSelect = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!Array.isArray(data)) throw new Error();
        setPendingData(data);
        setShowRestoreConfirm(true);
      } catch {
        setMessage("❌ ファイルが正しくありません");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const handleRestoreConfirm = () => {
    onRestore(pendingData);
    setShowRestoreConfirm(false);
    setPendingData(null);
    setMessage(`✅ ${pendingData.length}件のリスナーを復元しました`);
  };

  return (
    <BottomSheet onClose={onClose}>
      <div style={{fontWeight:900,fontSize:"1rem",color:S.text,marginBottom:18}}>バックアップ・復元</div>

      {message && (
        <div style={{background:"#1a2a1a",border:"1.5px solid #3a6040",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:"0.85rem",color:"#80e0a0"}}>
          {message}
        </div>
      )}

      {/* バックアップ */}
      <div style={{background:S.card,border:`1px solid ${S.border}`,borderRadius:12,padding:"14px",marginBottom:12}}>
        <div style={{fontSize:"0.78rem",fontWeight:700,color:S.sub,marginBottom:4}}>💾 バックアップ</div>
        <div style={{fontSize:"0.72rem",color:S.dim,marginBottom:12}}>全リスナーとバッジ履歴をJSONファイルとして保存します。</div>
        <Btn onClick={handleBackup} style={{width:"100%",padding:"10px",borderRadius:9,background:"linear-gradient(135deg,#2a4080,#3a60c0)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.85rem"}}>
          ダウンロードして保存
        </Btn>
      </div>

      {/* 復元 */}
      <div style={{background:S.card,border:`1px solid ${S.border}`,borderRadius:12,padding:"14px",marginBottom:20}}>
        <div style={{fontSize:"0.78rem",fontWeight:700,color:S.sub,marginBottom:4}}>📂 復元</div>
        <div style={{fontSize:"0.72rem",color:S.dim,marginBottom:12}}>バックアップファイルを選択して復元します。現在のデータは上書きされます。</div>
        <label style={{display:"block",width:"100%",padding:"10px",borderRadius:9,background:"linear-gradient(135deg,#402a20,#804030)",border:"none",color:"#ffb080",fontWeight:700,fontSize:"0.85rem",textAlign:"center",cursor:"pointer"}}>
          ファイルを選択して復元
          <input type="file" accept=".json" onChange={handleFileSelect} style={{display:"none"}} />
        </label>
      </div>

      <Btn onClick={onClose} style={{width:"100%",padding:"12px",borderRadius:10,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.dim,fontWeight:700,fontSize:"0.9rem"}}>閉じる</Btn>

      {showRestoreConfirm && (
        <div onClick={()=>setShowRestoreConfirm(false)} style={{position:"fixed",inset:0,zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.7)"}}>
          <div onClick={e=>e.stopPropagation()} style={{background:S.card2,border:"2px solid #5a4020",borderRadius:16,padding:"24px 20px",maxWidth:320,width:"90%",textAlign:"center"}}>
            <div style={{fontSize:"1.5rem",marginBottom:10}}>⚠️</div>
            <div style={{fontWeight:900,fontSize:"1rem",color:S.text,marginBottom:8}}>復元の確認</div>
            <div style={{fontSize:"0.82rem",color:S.dim,marginBottom:20}}>
              {pendingData?.length}件のリスナーデータを復元します。<br />
              <span style={{color:"#f5a060",fontWeight:700}}>現在のデータはすべて上書きされます。</span>
            </div>
            <div style={{display:"flex",gap:8}}>
              <Btn onClick={()=>setShowRestoreConfirm(false)} style={{flex:1,padding:"12px",borderRadius:10,background:"#1a1530",border:`1.5px solid ${S.border}`,color:S.sub,fontWeight:700,fontSize:"0.9rem"}}>キャンセル</Btn>
              <Btn onClick={handleRestoreConfirm} style={{flex:1,padding:"12px",borderRadius:10,background:"linear-gradient(135deg,#a06020,#c08030)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.9rem"}}>復元する</Btn>
            </div>
          </div>
        </div>
      )}
    </BottomSheet>
  );
}

// メインアプリ
function App() {
  const [listeners, setListenersRaw] = useState(() => loadListeners());
  const [showAdd, setShowAdd] = useState(false);
  const [detail, setDetail] = useState(null);
  const [search, setSearch] = useState("");
  const [addBadgeFor, setAddBadgeFor] = useState(null);
  const [editListenerFor, setEditListenerFor] = useState(null);
  const [showBackupMenu, setShowBackupMenu] = useState(false);

  const setListeners = (d) => { setListenersRaw(d); saveListeners(d); };

  const addListener = (fields) => setListeners([...listeners, { id:newId(), badges:[], ...fields }]);
  const editListener = (id, fields) => setListeners(listeners.map(l => l.id===id ? {...l,...fields} : l));
  const deleteListener = (id) => setListeners(listeners.filter(l => l.id!==id));
  const addBadge = (lid, badge) => setListeners(listeners.map(l => l.id===lid ? {...l, badges:[...l.badges, badge]} : l));
  const editBadge = (lid, upd) => setListeners(listeners.map(l => l.id===lid ? {...l, badges:l.badges.map(b => b.id===upd.id ? upd : b)} : l));
  const deleteBadge = (lid, bid) => setListeners(listeners.map(l => l.id===lid ? {...l, badges:l.badges.filter(b => b.id!==bid)} : l));
  const restoreListeners = (data) => setListeners(data);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return q ? listeners.filter(l=>l.name.toLowerCase().includes(q)) : listeners;
  }, [listeners, search]);

  const detailListener = detail ? listeners.find(l=>l.id===detail.id) : null;

  return (
    <div style={{minHeight:"100vh",background:S.bg,color:S.text,fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif",maxWidth:430,margin:"0 auto"}}>
      <div style={{background:"linear-gradient(135deg,#2a1a3e,#1a0e2e)",borderBottom:`1.5px solid ${S.border2}`,padding:"18px 20px 14px",position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{fontSize:"0.62rem",color:S.accent,fontWeight:700,letterSpacing:"0.2em",marginBottom:2}}>IRIAM</div>
            <div style={{fontSize:"1.1rem",fontWeight:900,color:S.text}}>バッジ管理</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={()=>setShowBackupMenu(true)} style={{padding:"8px 12px",borderRadius:10,background:"#2a1a3e",border:`1.5px solid ${S.border2}`,color:S.sub,fontWeight:700,fontSize:"0.85rem"}}>…</Btn>
            <Btn onClick={()=>setShowAdd(true)} style={{padding:"8px 16px",borderRadius:10,background:"linear-gradient(135deg,#f5607c,#7c72f5)",border:"none",color:"#fff",fontWeight:700,fontSize:"0.85rem"}}>＋ 追加</Btn>
          </div>
        </div>
      </div>

      <div style={{padding:"16px 14px 40px"}}>
        <div style={{marginBottom:14}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 リスナー名で検索"
            style={{width:"100%",background:"#1a1530",border:`1.5px solid ${S.border}`,borderRadius:10,padding:"10px 14px",color:S.text,fontSize:"0.85rem",outline:"none",fontFamily:"inherit"}} />
        </div>
        {filtered.length === 0 ? (
          <div style={{color:S.fainter,textAlign:"center",padding:"40px 0",fontSize:"0.9rem"}}>
            {listeners.length===0 ? "リスナーを追加してみましょう" : "該当するリスナーがいません"}
          </div>
        ) : filtered.map(l=>(
          <ListenerCard key={l.id} listener={l}
            onTap={()=>setDetail(l)}
            onAddBadge={()=>setAddBadgeFor(l)}
            onEditListener={()=>setEditListenerFor(l)}
          />
        ))}
      </div>

      {showBackupMenu && (
        <BackupMenuModal listeners={listeners} onRestore={restoreListeners} onClose={()=>setShowBackupMenu(false)} />
      )}
      {showAdd && <ListenerFormModal onSave={addListener} onClose={()=>setShowAdd(false)} />}
      {addBadgeFor && (
        <AddBadgeModal listener={addBadgeFor}
          onSave={badge=>{ addBadge(addBadgeFor.id, badge); setAddBadgeFor(null); }}
          onClose={()=>setAddBadgeFor(null)} />
      )}
      {editListenerFor && (
        <ListenerFormModal initial={editListenerFor}
          onSave={fields=>{ editListener(editListenerFor.id, fields); setEditListenerFor(null); }}
          onClose={()=>setEditListenerFor(null)} />
      )}
      {detailListener && (
        <ListenerDetail listener={detailListener}
          onEditBadge={editBadge} onDeleteBadge={deleteBadge}
          onDelete={deleteListener} onClose={()=>setDetail(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
